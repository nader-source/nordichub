<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<title>Nordic Hub admin</title>
<style>
:root{--bg:#f7f4ed;--cream:#f3ede2;--ink:#202b27;--sage:#a6a995;--sage-d:#6e715f;--blue:#8fa3a8;--blue-d:#5d7378;--muted:#6b706a;--line:#e3dccd;--ok:#2f6b4a;--warn:#a5641f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Open Sans",-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Jost,sans-serif;font-weight:400}
button{font:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 18px 90px}
.logo img{display:block;width:150px;height:auto}
.logo small{display:block;font-family:Jost,sans-serif;font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:var(--sage-d);margin-top:6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #d8cfba;border-radius:3px;background:#fff;color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sage);outline-offset:1px}
label.f{display:block;font-family:Jost,sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-family:Jost,sans-serif;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.btn.o{background:transparent;color:var(--ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.7rem}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.err{color:#a02020;font-size:.88rem;margin-top:10px;min-height:1.2em}

#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:28px}
.box h1{font-size:1.8rem;margin:22px 0 4px}
.box p{color:var(--muted);font-size:.92rem;margin-bottom:16px}
.box .btn{margin-top:12px}

#app{display:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top .r{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin:18px 0 14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;font-family:Jost,sans-serif;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.view{display:none}.view.on{display:block}

.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.list{display:grid;gap:10px}
.h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:600;font-size:1.05rem}
.meta{font-size:.82rem;color:var(--muted)}
.pill{font-family:Jost,sans-serif;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-open,.p-paid{background:#dff0e5;color:var(--ok)}
.p-draft,.p-unpaid{background:#f6ead9;color:var(--warn)}
.p-closed,.p-cancelled{background:#e9e9e6;color:#666}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sum{margin:8px 0 2px;font-size:.95rem}
.sum b{color:var(--ink)}
.ct{font-size:.9rem}.ct a{color:var(--blue-d)}
.nt{font-size:.88rem;color:#4a514c;background:var(--bg);border-left:2px solid var(--sage);padding:6px 10px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:32px 0}
.sec{font-family:Jost,sans-serif;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
@media(min-width:620px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.stat .n{font-family:Jost,sans-serif;font-size:1.7rem;line-height:1.1}
.stat .l{font-family:Jost,sans-serif;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stat.hl .n{color:var(--blue-d)}
.bar{height:8px;background:#e9e2d2;border-radius:99px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .5s}
.barl{font-size:.8rem;color:var(--muted);margin-bottom:14px}
.mini{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:8px}
.mini b{color:var(--ink);font-weight:600}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:.84rem;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{display:grid;gap:12px}
details.add{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:4px}
details.add summary{padding:13px 16px;cursor:pointer;font-weight:600}
details.add form{padding:0 16px 16px;display:grid;gap:10px}
label.chk{display:flex;gap:8px;align-items:center;font-size:.92rem}
label.chk input{width:auto;min-height:0}
dialog{border:1px solid var(--line);border-radius:6px;padding:0;width:min(94vw,500px);color:var(--ink)}
dialog::backdrop{background:rgba(32,43,39,.45)}
dialog form{padding:20px;display:grid;gap:12px}
dialog h2{font-size:1.4rem}
.row2{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.hint{font-size:.8rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="logo"><img src="img/logo-dark.png" alt="Nordic Hub" width="1200" height="287"><small>Admin</small></div>
    <h1>Sign in</h1>
    <p>Manage events and bookings.</p>
    <form id="lf" autocomplete="off">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn full" id="lb" type="button">Sign in</button>
      <div class="err" id="le"></div>
    </form>
  </div>
</div>

<div id="app">
  <div class="wrap">
    <div class="top">
      <div class="logo"><img src="img/logo-dark.png" alt="Nordic Hub" width="1200" height="287"><small>Admin</small></div>
      <div class="r">
        <button class="btn o sm" id="refresh" type="button">Refresh</button>
        <button class="btn o sm" id="logout" type="button">Sign out</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab on" data-tab="events" type="button">Events</button>
      <button class="tab" data-tab="bookings" type="button">Bookings</button>
    </div>

    <!-- EVENTS -->
    <section class="view on" id="v-events">
      <button class="btn" id="newEv" type="button">+ New event</button>
      <div class="sec">Open</div><div class="list" id="ev-open"></div>
      <div class="sec">Drafts</div><div class="list" id="ev-draft"></div>
      <div class="sec">History (closed)</div><div class="list" id="ev-closed"></div>
    </section>

    <!-- BOOKINGS -->
    <section class="view" id="v-bookings">
      <label class="f" for="evsel">Event</label>
      <select id="evsel"></select>
      <div class="stats" id="stats"></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="barl" id="barl"></div>

      <details class="add">
        <summary>+ Add booking manually</summary>
        <form id="af">
          <input id="an" placeholder="Name" required>
          <div class="grid2"><input id="ag" type="number" min="1" max="200" inputmode="numeric" placeholder="Guests" required>
            <input id="ap" type="tel" placeholder="Phone"></div>
          <input id="ae" type="email" placeholder="Email (optional)">
          <input id="ano" placeholder="Note (optional)">
          <label class="chk"><input id="apd" type="checkbox"> Already paid</label>
          <button class="btn" type="submit">Save booking</button>
        </form>
      </details>

      <div class="chips" id="chips"></div>
      <input id="q" type="search" placeholder="Search name, email or phone" style="margin-bottom:12px">
      <div class="list" id="list"></div>
    </section>
  </div>
</div>

<dialog id="evd"><form id="evf">
  <h2 id="evdT">New event</h2>
  <div><label class="f" for="e_name">Event name</label><input id="e_name" required placeholder="e.g. Julebord"></div>
  <div class="grid2">
    <div><label class="f" for="e_date">Date (as shown to guests)</label><input id="e_date" placeholder="Lørdag 28. november 2026"></div>
    <div><label class="f" for="e_time">Time</label><input id="e_time" placeholder="18:30"></div>
  </div>
  <div><label class="f" for="e_venue">Venue</label><input id="e_venue"></div>
  <div class="grid2">
    <div><label class="f" for="e_price">Price per person (€)</label><input id="e_price" type="number" min="0" step="0.5" inputmode="decimal" required></div>
    <div><label class="f" for="e_cap">Capacity (0 = no limit)</label><input id="e_cap" type="number" min="0" inputmode="numeric" value="0"></div>
  </div>
  <div><label class="f" for="e_notes">Internal notes</label><input id="e_notes" placeholder="Only visible in admin"></div>
  <label class="chk" id="e_openw"><input id="e_open" type="checkbox"> Open for booking right away</label>
  <p class="hint">Open events appear in the booking form. With several open events, guests choose which one to book.</p>
  <div class="row2"><button class="btn o sm" type="button" id="evcancel">Cancel</button><button class="btn sm" type="submit" id="evsave">Save event</button></div>
</form></dialog>

<dialog id="md"><form id="mf">
  <h2>Send payment link</h2>
  <div class="hint" id="mto"></div>
  <input id="mlink" type="url" placeholder="Paste payment link (SumUp / Stripe)" required>
  <textarea id="mmsg" placeholder="Personal message (optional)" style="min-height:90px"></textarea>
  <div class="row2"><button class="btn o sm" type="button" id="mcancel">Cancel</button><button class="btn sm" type="submit" id="msend">Send email</button></div>
</form></dialog>

<dialog id="cd"><form id="cf">
  <h2 id="cdT">Are you sure?</h2>
  <p class="hint" id="cdM"></p>
  <div class="row2"><button class="btn o sm" type="button" id="cno">No</button><button class="btn sm" type="submit">Yes</button></div>
</form></dialog>

<div id="toast"></div>

<script src="config.js"></script>
<script>
var API = (window.SITE && window.SITE.formEndpoint) || '';
var PW = '', DATA = {rows: [], events: [], cfg: {}}, CUR = '', FILTER = 'active', Q = '', EDIT = '', MID = '', CONFIRM = null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on')},2200)}
function isAuth(e){return e && String(e.message||e).indexOf('AUTH')>=0}
function call(fn){
  var args=[].slice.call(arguments,1);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,args:[PW].concat(args)})})
    .then(function(r){return r.json()}).then(function(j){if(!j.ok) throw new Error(j.error||'Error'); return j.result});
}
function fail(e){ if(isAuth(e)){ logout(true); } else toast('Error: '+(e.message||e)); }
function ask(title,msg,fn){ $('cdT').textContent=title; $('cdM').textContent=msg; CONFIRM=fn; $('cd').showModal(); }
$('cf').addEventListener('submit',function(e){e.preventDefault();$('cd').close();if(CONFIRM)CONFIRM();});
$('cno').addEventListener('click',function(){$('cd').close();});

/* ---- auth ---- */
function login(e){
  if(e&&e.preventDefault)e.preventDefault(); if($('lb').disabled)return;
  $('le').textContent=''; PW=$('pw').value; $('lb').disabled=true;
  call('adminList').then(function(d){
    DATA=d; try{sessionStorage.setItem('nhpw',PW)}catch(_){}
    $('login').style.display='none'; $('app').style.display='block'; pickDefault(); render();
  }).catch(function(err){ $('le').textContent=isAuth(err)?'Wrong password.':'Could not connect. Check your connection and try again.'; })
  .then(function(){$('lb').disabled=false});
}
function logout(expired){
  PW=''; try{sessionStorage.removeItem('nhpw')}catch(_){}
  $('app').style.display='none'; $('login').style.display='grid'; $('pw').value='';
  if(expired===true) $('le').textContent='Session expired. Please sign in again.';
}
function load(){ return call('adminList').then(function(d){DATA=d; if(!evById(CUR)) pickDefault(); render();}).catch(fail); }

/* ---- helpers ---- */
function evById(id){ return DATA.events.filter(function(e){return e.id===id})[0]; }
function pickDefault(){
  var o=DATA.events.filter(function(e){return e.status==='Open'});
  CUR=(o[0]||DATA.events[DATA.events.length-1]||{}).id||'';
}
function pill(s){ return '<span class="pill p-'+String(s).toLowerCase()+'">'+esc(s)+'</span>'; }
function when(ev){ return [ev.date,ev.time].filter(Boolean).join(' · '); }

/* ---- render ---- */
function render(){ renderEvents(); renderBookings(); }

function evCard(ev){
  var s=ev.stats||{}, a='';
  if(ev.status==='Draft') a+='<button class="btn sm" data-ea="open" data-id="'+esc(ev.id)+'">Open for booking</button>';
  if(ev.status==='Open')  a+='<button class="btn sm" data-ea="close" data-id="'+esc(ev.id)+'">Close event</button>';
  if(ev.status==='Closed')a+='<button class="btn o sm" data-ea="open" data-id="'+esc(ev.id)+'">Reopen</button>';
  a+='<button class="btn o sm" data-ea="edit" data-id="'+esc(ev.id)+'">Edit</button>';
  a+='<button class="btn o sm" data-ea="view" data-id="'+esc(ev.id)+'">Bookings</button>';
  var cap = ev.capacity>0 ? ' / '+ev.capacity : '';
  return '<div class="card"><div class="h"><div><div class="nm">'+esc(ev.name)+'</div><div class="meta">'+esc(when(ev)||'No date set')+
    (ev.venue?' · '+esc(ev.venue):'')+'</div></div>'+pill(ev.status)+'</div>'+
    '<div class="mini"><span><b>'+ev.price+' €</b> per person</span><span><b>'+(s.guests||0)+cap+'</b> guests</span>'+
    '<span><b>'+(s.bookings||0)+'</b> bookings</span><span><b>'+(s.paid||0)+' €</b> paid</span><span><b>'+(s.unpaid||0)+' €</b> outstanding</span></div>'+
    (ev.notes?'<div class="nt">'+esc(ev.notes)+'</div>':'')+'<div class="acts">'+a+'</div></div>';
}
function renderEvents(){
  ['Open','Draft','Closed'].forEach(function(st){
    var el=$('ev-'+st.toLowerCase()), list=DATA.events.filter(function(e){return e.status===st}).slice().reverse();
    el.innerHTML = list.length ? list.map(evCard).join('') : '<div class="empty">'+(st==='Open'?'No open events. Guests cannot book right now.':st==='Draft'?'No drafts.':'No closed events yet.')+'</div>';
  });
}
function renderBookings(){
  var sel=$('evsel');
  sel.innerHTML = DATA.events.slice().reverse().map(function(e){
    return '<option value="'+esc(e.id)+'"'+(e.id===CUR?' selected':'')+'>'+esc(e.name)+' · '+esc(e.date||'')+' ('+e.status+')</option>';
  }).join('') || '<option value="">No events</option>';
  var ev=evById(CUR)||{stats:{}}, s=ev.stats||{};
  var cap=ev.capacity||0;
  var cards=[['Bookings',s.bookings||0,''],['Guests',(s.guests||0)+(cap?' / '+cap:''),''],['Paid guests',s.paidGuests||0,''],
             ['Paid (€)',s.paid||0,''],['Outstanding (€)',s.unpaid||0,'hl'],cap?['Seats left',cap-(s.guests||0),'']:['Total (€)',(s.paid||0)+(s.unpaid||0),'']];
  $('stats').innerHTML=cards.map(function(c){return '<div class="stat '+c[2]+'"><div class="n">'+c[1]+'</div><div class="l">'+c[0]+'</div></div>'}).join('');
  var pct=s.guests?Math.round(100*s.paidGuests/s.guests):0;
  $('bar').style.width=pct+'%';
  $('barl').textContent=(s.paidGuests||0)+' of '+(s.guests||0)+' guests have paid ('+pct+'%)'+(s.cancelled?' · '+s.cancelled+' cancelled':'');
  var chips=[['active','All'],['Unpaid','Unpaid'],['Paid','Paid'],['Cancelled','Cancelled']];
  $('chips').innerHTML=chips.map(function(c){return '<button type="button" class="chip '+(FILTER===c[0]?'on':'')+'" data-f="'+c[0]+'">'+c[1]+'</button>'}).join('');
  var rows=DATA.rows.filter(function(r){
    if(r.eventId!==CUR) return false;
    if(FILTER==='active'&&r.status==='Cancelled') return false;
    if(FILTER!=='active'&&r.status!==FILTER) return false;
    if(Q){var h=(r.name+' '+r.email+' '+r.phone+' '+r.id).toLowerCase(); if(h.indexOf(Q)<0) return false;}
    return true;
  }).reverse();
  $('list').innerHTML=rows.length?rows.map(bCard).join(''):'<div class="empty">No bookings to show.</div>';
}
function bCard(r){
  var a='';
  if(r.status==='Unpaid') a+='<button class="btn sm" data-a="Paid" data-id="'+esc(r.id)+'">Mark as paid</button>';
  if(r.status==='Paid') a+='<button class="btn o sm" data-a="Unpaid" data-id="'+esc(r.id)+'">Undo payment</button>';
  if(r.email && r.status!=='Cancelled') a+='<button class="btn o sm" data-a="mail" data-id="'+esc(r.id)+'">Send payment link</button>';
  if(r.email) a+='<a class="btn o sm" href="mailto:'+esc(r.email)+'">Reply to guest</a>';
  if(r.status!=='Cancelled') a+='<button class="btn o sm" data-a="Cancelled" data-id="'+esc(r.id)+'">Cancel booking</button>';
  else a+='<button class="btn o sm" data-a="Unpaid" data-id="'+esc(r.id)+'">Restore</button>';
  return '<div class="card"'+(r.status==='Cancelled'?' style="opacity:.6"':'')+'><div class="h"><div><div class="nm">'+esc(r.name)+'</div>'+
    '<div class="meta">'+esc(r.id)+' · '+esc(r.ts)+' · '+(r.lang==='en'?'English':'Norwegian')+'</div></div>'+pill(r.status)+'</div>'+
    '<div class="sum"><b>'+r.guests+'</b> guests · <b>'+r.amount+' €</b>'+(r.paidAt?' · paid '+esc(r.paidAt):'')+'</div>'+
    (r.email?'<div class="ct"><a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></div>':'')+
    (r.phone?'<div class="ct"><a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a></div>':'')+
    (r.notes?'<div class="nt">'+esc(r.notes)+'</div>':'')+'<div class="acts">'+a+'</div></div>';
}

/* ---- events actions ---- */
function openEditor(ev){
  EDIT=ev?ev.id:''; $('evdT').textContent=ev?'Edit event':'New event';
  $('e_name').value=ev?ev.name:''; $('e_date').value=ev?ev.date:''; $('e_time').value=ev?ev.time:'';
  $('e_venue').value=ev?ev.venue:'C. Manises, 18, Plaza de Sol, 03580 Alfaz del Pi, Alicante';
  $('e_price').value=ev?ev.price:''; $('e_cap').value=ev?ev.capacity:0; $('e_notes').value=ev?ev.notes:'';
  $('e_open').checked=false; $('e_openw').style.display=ev?'none':'flex';
  $('evd').showModal();
}
$('newEv').addEventListener('click',function(){openEditor(null)});
$('evcancel').addEventListener('click',function(){$('evd').close()});
$('evf').addEventListener('submit',function(e){
  e.preventDefault(); $('evsave').disabled=true;
  var o={id:EDIT,name:$('e_name').value,date:$('e_date').value,time:$('e_time').value,venue:$('e_venue').value,
         price:$('e_price').value,capacity:$('e_cap').value,notes:$('e_notes').value,status:$('e_open').checked?'Open':'Draft'};
  call('adminSaveEvent',o).then(function(){ $('evd').close(); toast(EDIT?'Event updated':'Event created'); return load(); })
  .catch(fail).then(function(){$('evsave').disabled=false});
});
function setEv(id,status,msg){
  call('adminSetEventStatus',id,status).then(function(){toast(msg);return load()}).catch(fail);
}

/* ---- clicks ---- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-ea],[data-a],[data-f]'); if(!t) return;
  if(t.dataset.tab){ document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===t)});
    document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id==='v-'+t.dataset.tab)}); return; }
  if(t.dataset.f){ FILTER=t.dataset.f; renderBookings(); return; }
  var id=t.dataset.id;
  if(t.dataset.ea){
    var ev=evById(id), a=t.dataset.ea;
    if(a==='edit') openEditor(ev);
    else if(a==='view'){ CUR=id; renderBookings(); document.querySelector('[data-tab=bookings]').click(); }
    else if(a==='open') ask('Open "'+ev.name+'"?','It will appear in the booking form right away.',function(){setEv(id,'Open','Event is open for booking')});
    else if(a==='close') ask('Close "'+ev.name+'"?','Guests can no longer book. The event and its bookings stay in your history.',function(){setEv(id,'Closed','Event closed')});
    return;
  }
  var a2=t.dataset.a;
  if(a2==='mail') return openMail(id);
  if(a2==='Cancelled') return ask('Cancel this booking?','The guests are removed from the totals. You can restore it later.',function(){setStatus(id,'Cancelled')});
  setStatus(id,a2);
});
function setStatus(id,status){
  var r=DATA.rows.filter(function(x){return x.id===id})[0]; if(!r) return;
  var old=r.status; r.status=status; renderBookings();
  call('adminSetStatus',id,status).then(function(){toast(status==='Paid'?'Marked as paid':status==='Cancelled'?'Booking cancelled':'Updated');return load()})
  .catch(function(e){r.status=old;renderBookings();fail(e)});
}
function openMail(id){
  var r=DATA.rows.filter(function(x){return x.id===id})[0]; if(!r) return;
  MID=id; $('mto').textContent='To: '+r.name+' <'+r.email+'> · '+r.guests+' guests · '+r.amount+' €';
  $('mlink').value=DATA.cfg.paymentLink||''; $('mmsg').value=''; $('md').showModal();
}
$('mcancel').addEventListener('click',function(){$('md').close()});
$('mf').addEventListener('submit',function(e){
  e.preventDefault(); $('msend').disabled=true;
  call('adminSendMail',MID,$('mlink').value,$('mmsg').value).then(function(){$('md').close();toast('Email sent')}).catch(fail)
  .then(function(){$('msend').disabled=false});
});
$('evsel').addEventListener('change',function(e){CUR=e.target.value;renderBookings()});
$('af').addEventListener('submit',function(e){
  e.preventDefault();
  if(!CUR) return toast('Create an event first');
  var o={eventId:CUR,name:$('an').value,guests:$('ag').value,phone:$('ap').value,email:$('ae').value,notes:$('ano').value,paid:$('apd').checked};
  call('adminAdd',o).then(function(){$('af').reset();toast('Booking saved');return load()}).catch(fail);
});
$('lf').addEventListener('submit',login); $('lb').addEventListener('click',login);
$('logout').addEventListener('click',function(){logout()});
$('refresh').addEventListener('click',function(){load().then(function(){toast('Refreshed')})});
$('q').addEventListener('input',function(e){Q=e.target.value.trim().toLowerCase();renderBookings()});
(function(){try{var p=sessionStorage.getItem('nhpw');if(p){PW=p;call('adminList').then(function(d){DATA=d;$('login').style.display='none';$('app').style.display='block';pickDefault();render()}).catch(function(){PW=''})}}catch(_){}})();
</script>
</body>
</html>
